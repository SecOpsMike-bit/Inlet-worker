name: V3 unresolved employer source discovery

on:
  workflow_dispatch:
  push:
    branches: [v3-profile-matching]
    paths:
      - '.github/workflows/probe-unresolved-v3.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect bounded public employer career feeds
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if any(s in href.lower() for s in (
                          "job", "career", "apply", "greenhouse", "lever", "ashby",
                          "recruit", "join", "talent", "workday", "icims", "smartrecruit",
                      )):
                          self.links.append(href)

          targets = {
              "Shopify Ashby lowercase": "https://api.ashbyhq.com/posting-api/job-board/shopify?includeCompensation=true",
              "Shopify Ashby capitalized": "https://api.ashbyhq.com/posting-api/job-board/Shopify?includeCompensation=true",
              "Shopify careers": "https://www.shopify.com/careers",
              "Kinaxis public Jibe API": "https://join.kinaxis.com/api/jobs?page=1",
              "Kinaxis public Jibe API page 2": "https://join.kinaxis.com/api/jobs?page=2",
              "Kinaxis jobs": "https://join.kinaxis.com/jobs",
              "Kinaxis sample": "https://join.kinaxis.com/jobs/35467?lang=en-us",
              "Field Effect careers": "https://fieldeffect.com/careers",
              "GoSecure careers": "https://legacy.gosecure.ai/careers/",
              "GoSecure current": "https://gosecure.ai/careers/",
          }
          for name, url in targets.items():
              result = {"source": name}
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (compatible; GetInletsV3FeedAudit/1.0)",
                      "Accept": "application/json,text/html;q=0.9,*/*;q=0.8",
                  })
                  with urllib.request.urlopen(request, timeout=12) as response:
                      raw = response.read(1250000)
                      data = raw.decode("utf-8", "replace")
                      result.update({"http": response.status, "url": response.url,
                                     "bytes_read": len(raw)})
                  if data.lstrip().startswith(("{", "[")):
                      try:
                          parsed = json.loads(data)
                          result["json_keys"] = list(parsed)[:30] if isinstance(parsed, dict) else []
                          jobs = parsed.get("jobs", []) if isinstance(parsed, dict) else parsed
                          result["jobs_count"] = len(jobs) if isinstance(jobs, list) else None
                          if isinstance(parsed, dict):
                              result["totalCount"] = parsed.get("totalCount")
                          if isinstance(jobs, list) and jobs and isinstance(jobs[0], dict):
                              if isinstance(jobs[0].get("data"), dict):
                                  result["nested_job_keys"] = list(jobs[0]["data"])
                                  result["nested_job_sample"] = {
                                      k: str(v)[:180] for k, v in jobs[0]["data"].items()
                                      if k in {"slug", "title", "req_id", "url", "location", "location_name",
                                               "city", "state", "country", "country_code", "posted_date",
                                               "date_posted", "datePosted", "posted", "job_id",
                                               "date", "categories", "employment_type"}
                                  }
                              result["first_job_keys"] = list(jobs[0])
                              result["first_job_sample"] = {
                                  k: str(v)[:130] for k, v in jobs[0].items()
                                  if k not in {"description", "descriptionHtml", "descriptionPlain"}
                              }
                          result["sample_jobs"] = [
                              {"title": j.get("title"), "location": j.get("location"),
                               "url": j.get("jobUrl") or j.get("applyUrl")}
                              for j in jobs[:3] if isinstance(j, dict)
                          ] if isinstance(jobs, list) else []
                      except ValueError:
                          result["json_truncated"] = True
                  else:
                      parser = Anchors()
                      parser.feed(data)
                      result["links"] = list(dict.fromkeys(parser.links))[:18]
                      result["html_signals"] = {
                          key: bool(re.search(pattern, data, re.I))
                          for key, pattern in {
                              "ashby": r"ashby(?:_jid|hq|\.com)",
                              "phenom": r"phenom|ph-?app",
                              "icims": r"icims",
                              "jobvite": r"jobvite",
                              "greenhouse": r"greenhouse",
                              "workday": r"myworkdayjobs",
                              "json_ld_jobposting": r"application/ld\\+json",
                          }.items()
                      }
              except Exception as exc:
                  result["error"] = type(exc).__name__
                  if isinstance(exc, urllib.error.HTTPError):
                      result["http"] = exc.code
              if name == "Shopify careers" and result.get("http") == 200:
                  links = re.findall(r'<a[^>]*href=["\\\']([^"\\\']*?/careers/[^"\\\']+)["\\\'][^>]*>(.*?)</a>', data, re.I | re.S)
                  result["job_anchor_samples"] = [
                      {"href": h, "text": re.sub(r"<[^>]+>", " ", t).strip()[:140]}
                      for h, t in links[:8]
                  ]
                  result["cyber_snippets"] = [
                      re.sub(r"\\s+", " ", data[max(0,m.start()-180):m.start()+320])[:500]
                      for m in list(re.finditer(r"security operations|security analyst|incident response|cybersecurity", data, re.I))[:5]
                  ]
              if name.startswith("Kinaxis") and result.get("http") == 200:
                  result["icims_snippets"] = [
                      re.sub(r"\\s+", " ", data[max(0,m.start()-250):m.start()+350])[:600]
                      for m in list(re.finditer(r"icims|jobId|jobs/35467|jobId", data, re.I))[:7]
                  ]
                  result["kinaxis_json_keys"] = list(dict.fromkeys(
                      re.findall(r'["\\\']([a-zA-Z][a-zA-Z_]+)["\\\']\\s*:', data[:80000])
                  ))[:35]
              print(json.dumps(result))
          PY
